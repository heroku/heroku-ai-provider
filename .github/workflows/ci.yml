name: CI

on: push

jobs:
  prettier:
    runs-on: ${{ matrix.os }}
    name: 'Prettier'

    strategy:
      matrix:
        node-version: [22.x]
        os: [pub-hk-ubuntu-22.04-small]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier check
        run: npm run prettier-check

  eslint:
    runs-on: ${{ matrix.os }}
    name: 'ESLint'

    strategy:
      matrix:
        node-version: [22.x]
        os: [pub-hk-ubuntu-22.04-small]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint check
        run: npm run lint

  types:
    runs-on: ${{ matrix.os }}
    name: 'TypeScript'

    strategy:
      matrix:
        node-version: [22.x]
        os: [pub-hk-ubuntu-22.04-small]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run type-check

  test:
    runs-on: ${{ matrix.os }}
    name: 'Test'

    strategy:
      matrix:
        node-version: [22.x]
        os: [pub-hk-ubuntu-22.04-small]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test